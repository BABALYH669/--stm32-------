; pc/config.ini —— 电脑端 gateway.py 的配置（架构变更后：设备直连 broker，本程序只做消费者）
;
; ⚠️ 本文件含凭据，不要提交到公共仓库。
; 若 broker 开了鉴权，把 username / password 填上；留空表示匿名连接。

[mqtt]
host = 127.0.0.1
port = 1883
username = BABA
password = lyh123..
topic_prefix = env
keepalive = 60

; 把中文渲染结果再发布回 MQTT 主题 {topic_prefix}/{dev}/display
;   true  = 发（在 MQTTX / EMQX Dashboard 里订阅 env/dev01/display 就能看到中文，带 retain）
;   false = 不发（只在 gateway.py 自己的窗口里看中文）
publish_cn = true
