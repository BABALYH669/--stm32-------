# pc/mosquitto.conf —— 本地 broker 配置（设备直连 broker 架构）
#
# 启动（在 cmd 里逐行敲，不要连注释一起复制）：
#   cd /d "C:\Program Files\mosquitto"
#   mosquitto -c "E:\WTFSS\学习\嵌入式开发\基于stm32的环境监测系统\pc\mosquitto.conf" -v
#
# ⚠️ mosquitto 的配置文件【只认 '#' 注释，不认 ';'】。
#    写成 ';' 会直接启动失败：Error: Unknown configuration variable ';'
#    （Python 的 .ini 才用 ';'，两种格式不要混。）
#
# ⚠️ 本配置是「匿名 + 监听所有网卡」，只适合局域网内调试。
#    若要接公网（例如 150.158.10.134 那种云端 broker），必须至少做到：
#      1) 设密码：mosquitto_passwd -c passwd <用户名>，然后启用下面两行
#      2) 关闭匿名
#      3) 上 TLS（8883 端口）并只放行必要来源
#    否则任何人只要能连上 1883，就能读你的数据、发你的控制命令。

listener 1883 0.0.0.0
allow_anonymous true

# ---- 启用鉴权时：打开下面两行，并把 allow_anonymous 改成 false ----
# allow_anonymous false
# password_file ./passwd

# ---- 调试阶段先不落盘 ----
# persistence 会往 ./data/ 写文件；工作目录若是 C:\Program Files\mosquitto
# 而你又没有管理员权限，就会多一个失败点，所以先注释掉。要用时再打开。
# persistence true
# persistence_location ./data/

# 日志
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
